server:
  port: 8080

spring:
  application:
    name: carbon-trading-platform
  datasource:
    url: jdbc:mysql://localhost:3306/carbon_trading?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.carbon: debug
